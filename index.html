<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Сузір'я нашої близькості</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <div id="parallax-bg-far"></div>
    <div id="parallax-bg-mid"></div>
    <div id="parallax-bg-near"></div>
    
    <!-- Wrapper to force strict stacking context -->
    <div style="position: absolute; inset: 0; z-index: 10;">
        <div id="constellation-container" style="z-index: 1;">
            <svg id="constellation-lines" width="100%" height="100%" preserveAspectRatio="none" style="position: absolute; inset: 0; z-index: -1;"></svg>
        </div>

        <div class="jar-container" id="jar-container" style="z-index: 99; transform: translate(-50%, -50%);">
            <div class="jar-body">
                <div class="jar-inner-light" id="jar-inner-light"></div>
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-svg-wrapper">
            <!-- Squircle SVG Mask and Border -->
            <svg viewBox="0 0 340 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="premium-gold" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#F9D423" />
                        <stop offset="50%" stop-color="#FF4E50" />
                        <stop offset="100%" stop-color="#F9D423" />
                    </linearGradient>
                    
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>

                    <!-- Elegant Squircle (Rounded Rectangle) -->
                    <rect id="squircle-path" x="2" y="2" width="336" height="396" rx="45" ry="45" />
                    
                    <clipPath id="squircle-clip">
                        <use href="#squircle-path" />
                    </clipPath>
                </defs>
                
                <use class="flower-glass-bg" href="#squircle-path" fill="rgba(20, 20, 40, 0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
                
                <use id="flower-snake" href="#squircle-path" class="snake hidden" fill="none" stroke="url(#premium-gold)" stroke-width="3" filter="url(#glow)" />
            </svg>
            
            <button class="close-btn" id="close-btn">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 13L13 1M1 1L13 13" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
